# storii v2 with its own Postgres. Set SERVERSECRET (and DB_PASSWORD) in .env before the first start.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DBNAME:-storii}
      POSTGRES_USER: ${DBUSER:-storii}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBUSER:-storii} -d ${DBNAME:-storii}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  storii-api:
    image: ghcr.io/b2dennis/storii-api:2
    build: .
    environment:
      ADDRESS: ":9999"
      # Signs nothing a client can see, but keys the fake prelogin salts; at least 16 characters.
      SERVERSECRET: ${SERVERSECRET:?set SERVERSECRET}
      # open while you create your account(s), then closed
      REGISTRATION: ${REGISTRATION:-closed}
      SESSIONDAYS: ${SESSIONDAYS:-90}
      # set when behind a reverse proxy, so rate limits use X-Forwarded-For
      TRUSTPROXY: ${TRUSTPROXY:-false}
      DBHOST: postgres
      DBPORT: "5432"
      DBNAME: ${DBNAME:-storii}
      DBUSER: ${DBUSER:-storii}
      DBPASS: ${DB_PASSWORD}
      DBSSLMODE: disable
    ports:
      - "9999:9999"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
